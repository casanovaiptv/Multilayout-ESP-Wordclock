name: Build Wordclock firmware
on:
  push:
    branches: [feature/wordclock-webinstaller]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publish ESP32 test installer to GitHub Pages'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ESP8266, ESP32, ESP32C3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install web build dependencies
        run: npm ci
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
      - name: Upload firmware build outputs
        uses: actions/upload-artifact@v4
        with:
          name: wordclock-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/*.bin
            .pio/build/${{ matrix.environment }}/*.elf
          if-no-files-found: error
      - name: Package ESP32 browser installer
        if: matrix.environment == 'ESP32'
        run: python docs/install/package_esp32.py
      - name: Upload ESP32 installer bundle
        if: matrix.environment == 'ESP32'
        uses: actions/upload-artifact@v4
        with:
          name: wordclock-esp32-webinstaller
          path: dist/webinstaller-esp32/
          if-no-files-found: error

  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == 'refs/heads/feature/wordclock-webinstaller'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: wordclock-esp32-webinstaller
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy ESP32 test installer
        id: deployment
        uses: actions/deploy-pages@v4
