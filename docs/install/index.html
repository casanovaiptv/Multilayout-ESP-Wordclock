<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP Wordclock – Webinstaller</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
    body{background:#10141e;color:#f3f5fb;margin:0;padding:2rem 1rem}
    main{max-width:680px;margin:auto}
    .panel{background:#1d2432;border:1px solid #354155;border-radius:16px;padding:1.5rem}
    select,button{font:inherit;padding:.75rem;border-radius:8px}
    select{background:#111827;color:white;border:1px solid #68758c;width:100%;margin:1rem 0}
    button{background:#607086;color:white;border:0;cursor:not-allowed;width:100%}
    small{color:#b4c0d1}
    a{color:#9bc9ff}
  </style>
</head>
<body>
<main>
  <h1>ESP Wordclock</h1>
  <p>Webinstaller für die Multilayout-ESP-Wordclock.</p>
  <section class="panel">
    <label for="board">Mikrocontroller auswählen</label>
    <select id="board">
      <option value="esp32">ESP32</option>
      <option value="esp32c3">ESP32-C3</option>
      <option value="esp8266">ESP8266</option>
    </select>
    <p id="status" role="status">Installer in Vorbereitung: Es sind noch keine geprüften Firmware-Dateien veröffentlicht.</p>
    <button type="button" disabled>Firmware installieren – noch nicht verfügbar</button>
    <small>Bitte keine fremden Firmware-Dateien flashen. Eine bestehende Konfiguration soll bei regulären Updates erhalten bleiben.</small>
  </section>
  <p><a href="https://github.com/casanovaiptv/Multilayout-ESP-Wordclock">Projekt auf GitHub</a></p>
</main>
<script>
  const board = document.getElementById('board');
  const status = document.getElementById('status');
  board.addEventListener('change', () => {
    const label = board.options[board.selectedIndex].text;
    status.textContent = label + ': Firmware-Manifest und Flash-Adressen müssen vor Freigabe getestet werden.';
  });
</script>
</body>
</html>
